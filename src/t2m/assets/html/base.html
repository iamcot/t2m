<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "BVP"; font-weight: 500; src: url("{{ assets }}/fonts/BeVietnamPro-Medium.ttf"); }
@font-face { font-family: "BVP"; font-weight: 800; src: url("{{ assets }}/fonts/BeVietnamPro-ExtraBold.ttf"); }
:root {
  --green: #00a651; --green-dark: #008244; --green-soft: #e9fff3; --yellow: #ffca05; --navy: #071b33;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: {{ W }}px; height: {{ H }}px; overflow: hidden; }
body { font-family: "BVP", sans-serif; font-weight: 500; color: var(--navy); background: {% block bg %}#fff{% endblock %}; }
{% block style %}{% endblock %}
</style>
</head>
<body>{% block body %}{% endblock %}</body>
</html>
