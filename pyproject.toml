[project]
name = "t2m"
version = "0.1.0"
description = "Tool làm video ngắn và ảnh chế cho anyLEARN bằng AI (kịch bản, giọng đọc, dựng video, duyệt, đăng)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "httpx>=0.27",
  "jinja2>=3.1",
  "playwright>=1.45",
  "anthropic>=0.40",
]

[project.optional-dependencies]
# Word timings for the karaoke subtitles when the TTS gives none (Apple Silicon only).
whisper = ["mlx-whisper>=0.4"]
dev = ["pytest>=8"]

[project.scripts]
t2m = "t2m.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t2m"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
